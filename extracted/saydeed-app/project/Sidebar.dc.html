  renderVals() {
    var self = this;
    var work = this.state.mode === 'work';
    return {
      isWork: work,
      isCode: !work,
      workBg: work ? '#086B91' : 'transparent',
      workFg: work ? '#FFFFFF' : '#405C6B',
      codeBg: work ? 'transparent' : '#086B91',
      codeFg: work ? '#405C6B' : '#FFFFFF',
      setWork: function () { self.setState({ mode: 'work' }); },
      setCode: function () { self.setState({ mode: 'code' }); }
    };

}
